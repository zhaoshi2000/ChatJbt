# GBT 1.2.0 - UTF-8
# Environment variables PORT / PROVIDER / DATA_DIR / TASK_TIMEOUT_SECONDS override this file.
server.port=48643
provider=browser
# browser: bound ChatGPT page; mock: offline test; openai: official Responses API.
data.dir=data
# Total per-task generation window, or maximum queue wait; 30..7200 seconds.
task.timeout.seconds=900
queue.max=20
# Independent conversations per account allowed to run concurrently (1..5).
bridge.concurrent=3
history.max=2000
# Never put an API key in this file. Set OPENAI_API_KEY in the environment.
# For openai mode, explicitly set a model enabled for your API project.
openai.model=
openai.base-url=https://api.openai.com/v1
