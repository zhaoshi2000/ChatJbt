<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GBT · 后台管理控制台</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="admin.css"><script type="module" src="admin.js"></script></head><body>
<header><div><span>GBT</span><strong>后台管理控制台</strong></div><a href="/web/">返回聊天客户端</a></header>
<main><section class="intro"><p class="eyebrow">LOCAL BACKGROUND CONSOLE</p><h1>账号与工作浏览器</h1><p>每个账号只维护一个独立、默认最小化的 ChatGPT 工作窗口。这里供后台人员处理账号、登录和验证码；普通聊天客户端不会显示管理内容。</p></section>
<section class="card"><h2>管理员验证</h2><label>本机管理员令牌<input id="adminToken" type="password" autocomplete="off" spellcheck="false" placeholder="粘贴 data/local-token.txt 的完整内容"></label><div class="actions"><button id="loadAccounts" class="primary">读取账号与运行状态</button><button id="legacyExport">导出旧版记录</button></div><p id="result" class="result" role="status"></p></section>
<section class="card"><h2>创建独立账号</h2><div class="inline"><label>账号名称<input id="newAccountName" maxlength="60" placeholder="例如：账号 A · 工作"></label><button id="createAccount" class="primary">创建账号</button></div><div id="credential" class="credential" hidden><strong id="credentialTitle"></strong><p>此令牌只显示一次，请妥善保存。</p><textarea id="createdToken" readonly rows="2"></textarea><button id="copyToken">复制账号令牌</button></div></section>
<section class="card"><div class="section-head"><div><h2>账号工作窗口</h2><p>显示/隐藏操作只控制当前浏览器配置文件绑定的账号，不会跨账号接管登录状态。</p></div><button id="refreshAccounts">刷新</button></div><div id="accounts" class="accounts"><p class="empty">验证管理员令牌后读取账号。</p></div></section></main>
</body></html>
